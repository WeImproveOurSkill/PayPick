name: Deploy Frontend to EC2

on:
  push:
    branches:
      - fe-deploy-set

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Install SSH key
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.EC2_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        eval "$(ssh-agent -s)"
        ssh-add ~/.ssh/id_rsa

    - name: Create known_hosts file if not exists
      run: |
        if [ ! -f ~/.ssh/known_hosts ]; then
          touch ~/.ssh/known_hosts
        fi

    - name: Add EC2 to known_hosts
      run: ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

    - name: Copy frontend files to EC2
      run: |
        rsync -avz -e "ssh -o StrictHostKeyChecking=no" ./fe/ ubuntu@${{ secrets.EC2_HOST }}:/home/ubuntu/paypick

    - name: Install dependencies and restart application
      run: |
        ssh -o StrictHostKeyChecking=no ubuntu@${{ secrets.EC2_HOST }} << 'EOF'
          # Update package index
          sudo apt-get update
          
          # Install Node.js (including npm)
          sudo apt-get install -y nodejs npm
          
          # Install pm2 globally
          sudo npm install -g pm2
          
          cd /home/ubuntu/paypick
          npm install
          npm run build
          pm2 restart next-app || pm2 start npm --name "next-app" -- start
        EOF
